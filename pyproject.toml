[project]
name = "prompt-built-validator"
version = "0.1.0"
description = "Offline expense policy validator"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_validator"]

[project.scripts]
expense-validate = "expense_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
